name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        build-type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The tests are on by default for a top-level build.
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      # Through CTest rather than the `check` target or the binary's path, which differs per generator. ctest
      # captures the run and prints it when the test fails, and the test's TIMEOUT turns a hang into a reported
      # failure carrying that output -- `unit_test::run` flushes the name of each test before starting it, so the
      # last line says where it stopped -- rather than a silent job kill. A separate step still distinguishes a
      # compiler which is stuck from a test which is.
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build-type }} --output-on-failure

  build-linux-clang:
    name: Build (ubuntu-24.04, clang, ${{ matrix.build-type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build-type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Clang 18, the ubuntu-24.04 default, reports `__cpp_concepts` as 201907. libstdc++ gates
      # <expected> on `__cpp_concepts >= 202002L`, so the header compiles to nothing and
      # `std::expected` does not exist. Clang 19 raised the macro for exactly this reason -- its
      # release notes call out enabling libstdc++'s <expected> -- and it ships in the runner's own
      # archive, so no third-party apt source is needed. This pins a version rather than following
      # the runner default because the default cannot build the library.
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19

      - name: Report Clang version
        run: clang++-19 --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_CXX_COMPILER=clang++-19

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Every other job runs on a little-endian host, so code that assumes byte order passes them all. The
  # SWAR integer parser did exactly that and read each group of eight digits backwards on a big-endian
  # target (#277). s390x is the usual big-endian target to emulate -- ppc64le, despite the name, is
  # little-endian.
  #
  # This cross-compiles with the distro's s390x GCC and runs the tests under qemu-user, which needs no
  # third-party action and no container. GCC 14 is the version because `std::expected` needs 13 or
  # newer. CMake runs each test through `CMAKE_CROSSCOMPILING_EMULATOR`, with `-L` pointing QEMU at
  # the s390x sysroot the cross packages install. The library is static so that no shared-library
  # search path has to resolve inside the emulator, and LTO is off because this job is about byte order,
  # not link-time optimization.
  #
  # Debug rather than an optimized build: `JSONV_DEBUG=1` drops the benchmark tests to a single
  # iteration, which matters when every instruction is emulated.
  build-s390x:
    name: Build (s390x, big-endian, qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install s390x cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-14-s390x-linux-gnu qemu-user

      - name: Report compiler version
        run: s390x-linux-gnu-g++-14 --version

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++-14
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu"
          -DJSONV_LTO=OFF
          -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ubuntu-24.04, clang, ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Clang 19 rather than the ubuntu-24.04 default of 18: 18 reports `__cpp_concepts` as 201907,
      # and libstdc++ gates <expected> on `__cpp_concepts >= 202002L`, so `std::expected` does not
      # exist there. See the build-linux-clang job for the full reasoning.
      #
      # The sanitizer runtimes live in libclang-rt-*-dev, which the clang package does not depend
      # on, so it is named explicitly and must match the pinned compiler version. The symbolizer is
      # in `llvm`, and without it every frame of a report comes back as `??:0`.
      - name: Install Clang and sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 libclang-rt-19-dev llvm

      - name: Report Clang version
        run: clang++-19 --version

      # Debug rather than an optimized build: `JSONV_DEBUG=1` drops the benchmark tests to a single
      # iteration, so the run spends its time on assertions instead of timing loops over the
      # multi-megabyte test data. The fuzz workflow already carries the optimized sanitizer build.
      - name: Configure
        run: >
          cmake -S . -B build
          -DJSONV_SANITIZE=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          # `detect_stack_use_after_return` is instrumented by default but only armed at runtime, so
          # it has to be asked for here. `halt_on_error` is already implied by
          # `-fno-sanitize-recover=all`; it is set anyway so the intent survives a flag edit.
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (ubuntu-24.04, clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # clang-tidy parses with the Clang it was built from, so it has the same problem as the compiler: 18, the
      # ubuntu-24.04 default, cannot see `std::expected`. See the build-linux-clang job for the full reasoning. 19 is
      # also the first release to read `ExcludeHeaderFilterRegex`, which is what keeps fast_float out of the report.
      - name: Install Clang and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-19 clang-tidy-19

      - name: Report clang-tidy version
        run: clang-tidy-19 --version

      # Configuring is enough. Nothing is generated at build time, so `compile_commands.json` is all clang-tidy needs.
      # Debug keeps `assert` alive: the analyzer takes an assertion as a fact, and without one it would explore paths
      # the code has already ruled out.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DJSONV_BUILD_TESTS=OFF
          -DCMAKE_CXX_COMPILER=clang++-19

      # The check list and its exceptions are in `.clang-tidy`, which makes every finding an error. The file regex
      # keeps the run to the library's sources should the tests ever be configured here too.
      - name: Run clang-tidy
        run: run-clang-tidy-19 -p build -quiet '/src/jsonv/'

  # The three ways a CMake project takes the library as a dependency, against this checkout: FetchContent with the
  # library built as a subproject, find_package against an installed prefix, and pkg-config. The package jobs cover
  # find_package against a real package on each platform; this covers the subproject path, which they cannot.
  consumer:
    name: Consumer (${{ matrix.linkage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        linkage:
          - static
          - shared

    env:
      SHARED: ${{ matrix.linkage == 'shared' && 'ON' || 'OFF' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      # FETCHCONTENT_SOURCE_DIR_JSONV points FetchContent at this checkout and skips its find_package() attempt, so
      # this is the add_subdirectory path and nothing else. FULLY_DISCONNECTED turns any attempt to download into an
      # error. The consumer's own `cmake --install` must not install the library, and its build must not have grown
      # a CPack configuration.
      - name: Consume via FetchContent
        run: |
          cmake -S examples/fetchcontent -B build-consumer-fetch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS="${SHARED}" \
            -DFETCHCONTENT_SOURCE_DIR_JSONV="${GITHUB_WORKSPACE}" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build-consumer-fetch --parallel
          ./build-consumer-fetch/jsonv-example
          test ! -e build-consumer-fetch/CPackConfig.cmake
          cmake --install build-consumer-fetch --prefix "${PWD}/consumer-prefix"
          test ! -e consumer-prefix/include/jsonv

      # A static archive is never linked, so the sanitizer and gcov runtimes its objects call into have to come from
      # the consumer's link line; jsonv::jsonv carries them in its link interface. The .gcda files prove the
      # instrumented code ran, not just linked.
      - name: Consume an instrumented static build via FetchContent
        if: matrix.linkage == 'static'
        run: |
          cmake -S examples/fetchcontent -B build-consumer-instrumented -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DJSONV_SANITIZE=ON \
            -DJSONV_COVERAGE=ON \
            -DFETCHCONTENT_SOURCE_DIR_JSONV="${GITHUB_WORKSPACE}" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build-consumer-instrumented --parallel
          ./build-consumer-instrumented/jsonv-example
          find build-consumer-instrumented -name '*.gcda' | grep -q .

      - name: Install jsonv to a prefix
        run: |
          cmake -S . -B build-lib -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS="${SHARED}" \
            -DJSONV_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/prefix"
          cmake --build build-lib --parallel
          cmake --install build-lib
          find prefix -type f -o -type l | sort

          for path in lib/cmake/jsonv/jsonv-config.cmake \
                      lib/cmake/jsonv/jsonv-config-version.cmake \
                      lib/cmake/jsonv/jsonv-targets.cmake \
                      lib/pkgconfig/libjsonv.pc \
                      include/jsonv/all.hpp \
                      include/jsonv/detail/scope_exit.hpp; do
            test -f "prefix/${path}"
          done

          if [ "${SHARED}" = OFF ]; then
            test -f prefix/lib/libjsonv.a
            grep -q 'JSONV_SO=0' prefix/lib/cmake/jsonv/jsonv-targets.cmake
            grep -q 'JSONV_SO=0' prefix/lib/pkgconfig/libjsonv.pc
          else
            test -f prefix/lib/libjsonv.so.2.0.0
            test -L prefix/lib/libjsonv.so.2.0
            test -L prefix/lib/libjsonv.so
            ! grep -q 'JSONV_SO' prefix/lib/cmake/jsonv/jsonv-targets.cmake
          fi

      # No source-dir override this time: FetchContent calls find_package(jsonv) first, CMAKE_PREFIX_PATH makes it
      # succeed, and FULLY_DISCONNECTED would fail the configure if it had not.
      - name: Consume via find_package
        run: |
          cmake -S examples/fetchcontent -B build-consumer-installed -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/prefix" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -E '^jsonv_DIR:PATH=.*/prefix/lib/cmake/jsonv$' build-consumer-installed/CMakeCache.txt
          cmake --build build-consumer-installed --parallel
          ./build-consumer-installed/jsonv-example

      - name: Consume via pkg-config
        run: |
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/prefix/lib/pkgconfig"
          pkg-config --cflags --libs libjsonv
          c++ -std=c++23 examples/fetchcontent/main.cpp $(pkg-config --cflags --libs libjsonv) \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/prefix/lib" -o jsonv-pc-example
          ./jsonv-pc-example

      # Nothing in the installed tree may depend on where it was configured to go: the CMake package files locate
      # themselves through CMAKE_CURRENT_LIST_DIR and libjsonv.pc through ${pcfiledir}. Moving the prefix is the
      # test, and both consumers are built against the moved copy.
      - name: Relocate the prefix and consume it again
        run: |
          mv prefix relocated
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/relocated/lib/pkgconfig"
          pkg-config --cflags --libs libjsonv
          c++ -std=c++23 examples/fetchcontent/main.cpp $(pkg-config --cflags --libs libjsonv) \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/relocated/lib" -o jsonv-pc-relocated
          ./jsonv-pc-relocated
          cmake -S examples/fetchcontent -B build-consumer-relocated -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/relocated" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -E '^jsonv_DIR:PATH=.*/relocated/lib/cmake/jsonv$' build-consumer-relocated/CMakeCache.txt
          cmake --build build-consumer-relocated --parallel
          ./build-consumer-relocated/jsonv-example

  packages:
    name: Packages (${{ matrix.format }})
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ubuntu:24.04
            cpack-generator: DEB
            package-glob: "*.deb"
          - format: rpm
            container: almalinux:10
            cpack-generator: RPM
            package-glob: "*.rpm"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install dependencies (DEB)
        if: matrix.format == 'deb'
        shell: bash
        run: |
          apt-get update
          apt-get install --yes \
            build-essential \
            ca-certificates \
            cmake \
            dpkg-dev \
            file \
            git \
            pkg-config

      - name: Install dependencies (RPM)
        if: matrix.format == 'rpm'
        shell: bash
        run: |
          dnf install -y \
            ca-certificates \
            cmake \
            file \
            findutils \
            gcc-c++ \
            git \
            make \
            pkgconf-pkg-config \
            rpm-build

      - name: Check out repository
        uses: actions/checkout@v6

      # `package` depends on `all`, so the tests -- on by default -- would be built and then ignored.
      - name: Configure package build
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJSONV_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCPACK_GENERATOR=${{ matrix.cpack-generator }}

      - name: Build packages
        shell: bash
        run: cmake --build build --target package --parallel

      - name: Inspect DEB packages
        if: matrix.format == 'deb'
        shell: bash
        run: |
          packages=(build/*.deb)
          test "${#packages[@]}" -ge 2

          dpkg-deb --field "${packages[@]}"
          for package in "${packages[@]}"; do
            dpkg-deb --contents "${package}"
          done

          runtime_package=$(find build -maxdepth 1 -name 'libjsonv[0-9]*.deb' -print -quit)
          development_package=$(find build -maxdepth 1 -name 'libjsonv-dev_*.deb' -print -quit)
          test -n "${runtime_package}"
          test -n "${development_package}"

          dpkg-deb --contents "${runtime_package}" | grep 'libjsonv\.so\.'
          dpkg-deb --contents "${development_package}" | grep 'include/jsonv/all.hpp'
          dpkg-deb --contents "${development_package}" | grep 'pkgconfig/libjsonv.pc'
          dpkg-deb --contents "${development_package}" | grep 'cmake/jsonv/jsonv-config.cmake'
          dpkg-deb --contents "${development_package}" | grep 'cmake/jsonv/jsonv-config-version.cmake'
          dpkg-deb --contents "${development_package}" | grep 'cmake/jsonv/jsonv-targets.cmake'

      - name: Inspect RPM packages
        if: matrix.format == 'rpm'
        shell: bash
        run: |
          packages=(build/*.rpm)
          test "${#packages[@]}" -ge 2

          rpm -qpi "${packages[@]}"
          rpm -qlp "${packages[@]}"

          runtime_package=$(find build -maxdepth 1 -name 'jsonv-[0-9]*.rpm' -print -quit)
          development_package=$(find build -maxdepth 1 -name 'jsonv-devel-*.rpm' -print -quit)
          test -n "${runtime_package}"
          test -n "${development_package}"

          rpm -qlp "${runtime_package}" | grep 'libjsonv\.so\.'
          rpm -qlp "${development_package}" | grep 'include/jsonv/all.hpp'
          rpm -qlp "${development_package}" | grep 'pkgconfig/libjsonv.pc'
          rpm -qlp "${development_package}" | grep 'cmake/jsonv/jsonv-config.cmake'
          rpm -qlp "${development_package}" | grep 'cmake/jsonv/jsonv-config-version.cmake'
          rpm -qlp "${development_package}" | grep 'cmake/jsonv/jsonv-targets.cmake'

      - name: Install DEB packages
        if: matrix.format == 'deb'
        shell: bash
        run: apt-get install --yes ./build/*.deb

      - name: Install RPM packages
        if: matrix.format == 'rpm'
        shell: bash
        run: dnf install -y ./build/*.rpm

      - name: Compile and run installed-package smoke test
        shell: bash
        run: |
          cat >/tmp/jsonv-smoke.cpp <<'EOF'
          #include <jsonv/all.hpp>

          int main()
          {
              jsonv::value value = jsonv::parse(R"({"answer":42})");
              return value.at("answer").as_integer() == 42 ? 0 : 1;
          }
          EOF

          c++ -std=c++23 /tmp/jsonv-smoke.cpp $(pkg-config --cflags --libs libjsonv) -o /tmp/jsonv-smoke
          /tmp/jsonv-smoke

      # The example's FetchContent declaration tries find_package(jsonv) first; the package installed to /usr is what
      # it has to find, and FULLY_DISCONNECTED makes falling back to a download an error.
      - name: Consume installed package with find_package
        shell: bash
        run: |
          cmake -S examples/fetchcontent -B smoke-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -E '^jsonv_DIR:PATH=/usr/' smoke-cmake/CMakeCache.txt
          cmake --build smoke-cmake --parallel
          ./smoke-cmake/jsonv-example

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonv-${{ matrix.format }}-packages
          path: build/${{ matrix.package-glob }}

  windows-packages:
    name: Packages (nuget)
    runs-on: windows-2025
    needs: build
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure package build
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DJSONV_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX=install-root
          -DCPACK_GENERATOR=NuGet

      - name: Build NuGet package
        shell: pwsh
        run: cmake --build build --config Release --target package --parallel

      - name: Install and inspect NuGet package
        shell: pwsh
        run: |
          $package = Get-ChildItem build -Filter '*.nupkg' |
            Select-Object -First 1
          if ($null -eq $package) {
            throw 'Expected a NuGet package in build/'
          }

          $source = (Resolve-Path build).Path
          nuget install jsonv `
            -Source $source `
            -OutputDirectory nuget-install `
            -NonInteractive `
            -Verbosity normal

          $packageRoot = Get-ChildItem nuget-install -Directory |
            Where-Object { $_.Name -like 'jsonv.*' } |
            Select-Object -First 1
          if ($null -eq $packageRoot) {
            throw 'Expected NuGet install root under nuget-install/'
          }

          $expected = @(
            'include\jsonv\all.hpp',
            'lib\jsonv.lib',
            'lib\cmake\jsonv\jsonv-config.cmake',
            'lib\cmake\jsonv\jsonv-config-version.cmake',
            'lib\cmake\jsonv\jsonv-targets.cmake',
            'build\native\jsonv.targets'
          )
          foreach ($path in $expected) {
            $fullPath = Join-Path $packageRoot.FullName $path
            if (-not (Test-Path $fullPath)) {
              throw "Missing expected NuGet package path: $path"
            }
          }

          # The package is a static library, so both consumers' files have to say JSONV_SO=0.
          foreach ($path in 'lib\cmake\jsonv\jsonv-targets.cmake', 'build\native\jsonv.targets') {
            $fullPath = Join-Path $packageRoot.FullName $path
            if (-not (Select-String -Path $fullPath -Pattern 'JSONV_SO=0' -Quiet)) {
              throw "Expected JSONV_SO=0 in ${path}"
            }
          }

      # The package root is the install prefix (CPACK_PACKAGING_INSTALL_PREFIX is empty for NuGet), so pointing
      # CMAKE_PREFIX_PATH at it is all find_package needs. The example's FetchContent declaration tries find_package
      # first, and FULLY_DISCONNECTED makes falling back to a download an error.
      - name: Compile and run installed-package smoke test
        shell: pwsh
        run: |
          $packageRoot = Get-ChildItem nuget-install -Directory |
            Where-Object { $_.Name -like 'jsonv.*' } |
            Select-Object -First 1

          cmake -S examples/fetchcontent -B smoke-build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$($packageRoot.FullName)" `
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          if (-not (Select-String -Path smoke-build\CMakeCache.txt -Pattern '^jsonv_DIR:PATH=' -Quiet)) {
            throw 'find_package(jsonv) did not resolve to the NuGet package'
          }
          cmake --build smoke-build --config Release --parallel
          .\smoke-build\Release\jsonv-example.exe

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonv-nuget-package
          path: build/*.nupkg

  macos-packages:
    name: Packages (macOS pkg)
    runs-on: macos-15
    needs: build
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install ninja

      - name: Configure package build
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJSONV_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DCPACK_GENERATOR=productbuild

      - name: Build macOS package
        run: cmake --build build --target package --parallel

      - name: Inspect macOS package
        shell: bash
        run: |
          packages=(build/*.pkg)
          if [ ! -e "${packages[0]}" ]; then
            echo "Expected a macOS package in build/" >&2
            exit 1
          fi

          package="${packages[0]}"
          pkgutil --payload-files "${package}" | tee package-files.txt

          grep 'usr/local/include/jsonv/all.hpp' package-files.txt
          grep 'usr/local/lib/libjsonv' package-files.txt
          grep 'usr/local/lib/pkgconfig/libjsonv.pc' package-files.txt
          grep 'usr/local/lib/cmake/jsonv/jsonv-config.cmake' package-files.txt
          grep 'usr/local/lib/cmake/jsonv/jsonv-config-version.cmake' package-files.txt
          grep 'usr/local/lib/cmake/jsonv/jsonv-targets.cmake' package-files.txt

      - name: Install macOS package
        shell: bash
        run: |
          packages=(build/*.pkg)
          if [ ! -e "${packages[0]}" ]; then
            echo "Expected a macOS package in build/" >&2
            exit 1
          fi

          sudo installer -pkg "${packages[0]}" -target /

      - name: Compile and run installed-package smoke test
        shell: bash
        run: |
          cat >/tmp/jsonv-smoke.cpp <<'EOF'
          #include <jsonv/all.hpp>

          int main()
          {
              jsonv::value value = jsonv::parse(R"({"answer":42})");
              return value.at("answer").as_integer() == 42 ? 0 : 1;
          }
          EOF

          c++ -std=c++23 /tmp/jsonv-smoke.cpp \
            -I/usr/local/include \
            -L/usr/local/lib \
            -Wl,-rpath,/usr/local/lib \
            -ljsonv \
            -o /tmp/jsonv-smoke
          /tmp/jsonv-smoke

      # /usr/local is on CMake's default search path, so the example's find_package(jsonv) attempt finds the
      # installed package without being told where; FULLY_DISCONNECTED makes falling back to a download an error.
      - name: Consume installed package with find_package
        shell: bash
        run: |
          cmake -S examples/fetchcontent -B smoke-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          grep -E '^jsonv_DIR:PATH=/usr/local/' smoke-cmake/CMakeCache.txt
          cmake --build smoke-cmake --parallel
          ./smoke-cmake/jsonv-example

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonv-macos-package
          path: build/*.pkg

  docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: ./config/make-doxygen

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc/html

  deploy-pages:
    name: Deploy documentation
    runs-on: ubuntu-24.04
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
