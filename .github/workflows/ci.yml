name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build-type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        build-type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake_args=(
            -S .
            -B build
            -G Ninja
            -DJSONV_BUILD_TESTS=ON
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          )

          cmake "${cmake_args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DJSONV_BUILD_TESTS=ON

      - name: Build and test
        run: cmake --build build --config ${{ matrix.build-type }} --target check --parallel

  packages:
    name: Packages (${{ matrix.format }})
    runs-on: ubuntu-24.04
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ubuntu:24.04
            cpack-generator: DEB
            package-glob: "*.deb"
          - format: rpm
            container: rockylinux:9
            cpack-generator: RPM
            package-glob: "*.rpm"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install dependencies (DEB)
        if: matrix.format == 'deb'
        shell: bash
        run: |
          apt-get update
          apt-get install --yes \
            build-essential \
            ca-certificates \
            cmake \
            dpkg-dev \
            file \
            git \
            ninja-build \
            pkg-config

      - name: Install dependencies (RPM)
        if: matrix.format == 'rpm'
        shell: bash
        run: |
          dnf install --yes \
            ca-certificates \
            cmake \
            file \
            findutils \
            gcc-c++ \
            git \
            ninja-build \
            pkgconf-pkg-config \
            rpm-build

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure package build
        shell: bash
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCPACK_GENERATOR=${{ matrix.cpack-generator }}

      - name: Build packages
        shell: bash
        run: cmake --build build --target package --parallel

      - name: Inspect DEB packages
        if: matrix.format == 'deb'
        shell: bash
        run: |
          packages=(build/*.deb)
          test "${#packages[@]}" -ge 2

          dpkg-deb --field "${packages[@]}"
          dpkg-deb --contents "${packages[@]}"

          runtime_package=$(find build -maxdepth 1 -name 'libjsonv[0-9]*.deb' -print -quit)
          development_package=$(find build -maxdepth 1 -name 'libjsonv-dev_*.deb' -print -quit)
          test -n "${runtime_package}"
          test -n "${development_package}"

          dpkg-deb --contents "${runtime_package}" | grep 'libjsonv\.so\.'
          dpkg-deb --contents "${development_package}" | grep 'include/jsonv/all.hpp'
          dpkg-deb --contents "${development_package}" | grep 'pkgconfig/libjsonv.pc'
          dpkg-deb --contents "${development_package}" | grep 'cmake/jsonv/jsonv-export.cmake'

      - name: Inspect RPM packages
        if: matrix.format == 'rpm'
        shell: bash
        run: |
          packages=(build/*.rpm)
          test "${#packages[@]}" -ge 2

          rpm -qpi "${packages[@]}"
          rpm -qlp "${packages[@]}"

          runtime_package=$(find build -maxdepth 1 -name 'jsonv-[0-9]*.rpm' -print -quit)
          development_package=$(find build -maxdepth 1 -name 'jsonv-devel-*.rpm' -print -quit)
          test -n "${runtime_package}"
          test -n "${development_package}"

          rpm -qlp "${runtime_package}" | grep 'libjsonv\.so\.'
          rpm -qlp "${development_package}" | grep 'include/jsonv/all.hpp'
          rpm -qlp "${development_package}" | grep 'pkgconfig/libjsonv.pc'
          rpm -qlp "${development_package}" | grep 'cmake/jsonv/jsonv-export.cmake'

      - name: Install DEB packages
        if: matrix.format == 'deb'
        shell: bash
        run: apt-get install --yes ./build/*.deb

      - name: Install RPM packages
        if: matrix.format == 'rpm'
        shell: bash
        run: dnf install --yes ./build/*.rpm

      - name: Compile and run installed-package smoke test
        shell: bash
        run: |
          cat >/tmp/jsonv-smoke.cpp <<'EOF'
          #include <jsonv/all.hpp>

          int main()
          {
              jsonv::value value = jsonv::parse(R"({"answer":42})");
              return value.at("answer").as_integer() == 42 ? 0 : 1;
          }
          EOF

          c++ -std=c++17 /tmp/jsonv-smoke.cpp $(pkg-config --cflags --libs libjsonv) -o /tmp/jsonv-smoke
          /tmp/jsonv-smoke

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonv-${{ matrix.format }}-packages
          path: build/${{ matrix.package-glob }}

  docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: ./config/make-doxygen

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doc/html

  deploy-pages:
    name: Deploy documentation
    runs-on: ubuntu-24.04
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
